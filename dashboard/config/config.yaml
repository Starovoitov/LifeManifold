paths:
  run_scan_dirs:
    - output
    - output/*
    - artifacts/*
  prompts_dir: prompts

defaults:
  grid_resolution: 50
  heatmap_metric: fitness
  min_fitness: 0.0

surrogate:
  enabled: true
  stub_mean: 0.5
  stub_uncertainty: 0.85

performance:
  prefer_polars: true
  large_archive_line_threshold: 5000
  table_max_rows: 500
  simulation_cache_size: 32
  heatmap_metrics:
    - fitness
    - stability
    - diversity
    - topology_interface_index
    - topology_window_heterogeneity
    - oscillation_score
