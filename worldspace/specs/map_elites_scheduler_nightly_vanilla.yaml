schema_version: "1.2"
# Q1 v3 B1 / RQ0 — Vanilla MAP-Elites (random emitter only).
# Protocol: artifacts/EXPERIMENT_PROTOCOL_Q1_v3.md §3.1
# Same budget as v2 nightly (650 × 50); no genetic, no LLM, no surrogate.
