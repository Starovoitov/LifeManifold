schema_version: "1.2"
# H1 shuffled placebo: same live MLP checkpoint as hints, but permute intact
# (fitness, uncertainty) pairs across the ~10 LLM slots after prepare_emit.
# Protocol: artifacts/Q1_H1_PLACEBO_LOCK.md
# Matched to map_elites_scheduler_nightly_llm.yaml except llm.hint_placebo.
iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

batch_emitters:
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm

initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: true
  hint_placebo: shuffle_batch

surrogate:
  enabled: true
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v3_mc_d005.pkl
  buffer_path: artifacts/surrogate/buffer_experiment_hints_placebo.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
  extinction_gate_threshold: 0.95
  calibration: artifacts/surrogate/checkpoints/calibration_v3_mc_d005.pkl

# Forkserver pool reused across iterations (numba_simulator must stay false).
performance:
  parallel_eval: true
  parallel_workers: 0
  llm_parallel_emit: true
  llm_parallel_workers: 4
  log_iteration_timing: true
