schema_version: "1.2"
# H2 eval-horizon extension: same threshold_gate as genetic_me_filter, but more
# iterations so real simulator calls approach the uniform arm's 32,500.
# At skip≈33.5%: 980 iters × 50 × 0.665 ≈ 32.6k evaluations (descriptive match).
# Protocol: artifacts/Q1_H2_RANKING_CONTROLS.md
iterations: 980
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

batch_emitters:
  - random
  - random
  - random
  - random
  - random
  - random
  - random
