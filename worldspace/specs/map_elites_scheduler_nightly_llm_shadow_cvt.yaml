schema_version: "1.3"
# CVT shadow acquisition for filter calibration (mode=shadow; all candidates evaluated).
iterations: 650
batch_size: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

archive:
  type: cvt
  n_centroids: 2500
  cvt_seed: 0
  lloyd_iterations: 50

batch_emitters:
  - random
