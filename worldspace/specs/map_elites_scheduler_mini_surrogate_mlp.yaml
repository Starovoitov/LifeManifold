schema_version: "1.2"
# Fast CI run with surrogate.model_type mlp (experimental checkpoint).
iterations: 2
batch_size: 4
grid_resolution: 10
early_extinction_step: 200
min_steps: 200

batch_emitters:
  - random
  - genetic
  - genetic
  - llm

initial_random_candidates: 0

genetic:
  mutation_scale: 0.02

llm:
  enabled: false

surrogate:
  enabled: true
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/latest.pkl
  buffer_path: artifacts/surrogate/buffer.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
  calibration: null
  surrogate_archive_path: artifacts/surrogate/surrogate_archive.jsonl
  acquisition:
    mode: off
  retrain:
    enabled: false
