initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: true

surrogate:
  enabled: true
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v2.pkl
  buffer_path: artifacts/surrogate/buffer_experiment_filter.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
  calibration: artifacts/surrogate/checkpoints/calibration.pkl
  surrogate_archive_path: artifacts/surrogate/surrogate_archive_experiment.jsonl
  acquisition:
    mode: filter
    policy: threshold_gate
    # Tuned offline on buffer hold-out (35k rows, Jun 2026):
    # - calibrated uncertainty ~0.0183 (constant); max_u must exceed that to allow skips
    # - 96% of hold-out preds are exactly 0; min_f in (0,0.7) -> same offline skip mass
    # - live never_skip_empty_bin + baseline coverage 39% -> ~37% effective skip (target 25-45%)
    min_predicted_fitness: 0.10
    max_uncertainty_to_skip: 0.022
    never_skip_empty_bin: true
  retrain:
    enabled: false

# Forkserver pool reused across iterations (numba_simulator must stay false).
performance:
  parallel_eval: true
  parallel_workers: 0
