initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: true

surrogate:
  enabled: false
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v2.pkl
  buffer_path: artifacts/surrogate/buffer_experiment_stub.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0

# Forkserver pool reused across iterations (numba_simulator must stay false).
performance:
  parallel_eval: true
  parallel_workers: 0
