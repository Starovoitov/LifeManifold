  - genetic
  - genetic

initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: false

surrogate:
  enabled: false
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v3_mc_d005.pkl
  buffer_path: artifacts/surrogate/buffer_experiment_genetic_me_maxfit.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0

performance:
  parallel_eval: true
  parallel_workers: 0
  llm_parallel_emit: false
  llm_parallel_workers: 0
  log_iteration_timing: true
