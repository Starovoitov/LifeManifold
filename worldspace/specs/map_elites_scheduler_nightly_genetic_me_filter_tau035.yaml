schema_version: "1.2"
# H2 threshold sensitivity: genetic ME + filter @ min_predicted_fitness=0.35.
# Same slot mix / checkpoint as genetic_me_filter (τ=0.45 reference arm).
iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

