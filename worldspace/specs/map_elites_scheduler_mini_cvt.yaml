schema_version: "1.3"
iterations: 20
batch_size: 4
early_extinction_step: 200
min_steps: 200

archive:
  type: cvt
  n_centroids: 25
  cvt_seed: 0
  lloyd_iterations: 50

# CI / reproducibility mini CVT run (20 x 4 = 80 evaluations).
batch_emitters:
  - random
  - genetic
  - genetic
  - llm

initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: false

surrogate:
  enabled: false
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v3_mc_d005.pkl
  buffer_path: artifacts/surrogate/buffer.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
