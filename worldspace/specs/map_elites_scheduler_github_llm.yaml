schema_version: "1.2"
# GitHub LLM special: nightly batch shape (50-wide, 20 LLM slots), CI-safe iteration budget.
# 120 × 50 = 6_000 evals (~2400 LLM calls); full nightly length: --iterations 650 (local / long runner).
iterations: 120
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200

batch_emitters:
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm

initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: true

surrogate:
  enabled: true
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v2.pkl
  buffer_path: artifacts/surrogate/buffer_github_llm.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0

# Forkserver pool reused across iterations (numba_simulator must stay false).
performance:
  parallel_eval: true
  parallel_workers: 0
