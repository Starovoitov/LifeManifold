schema_version: "1.2"
# GitHub Actions workflow_dispatch: LLM slots + surrogate hints from nightly.pkl.
iterations: 20
batch_size: 4
grid_resolution: 10
early_extinction_step: 200
min_steps: 200

batch_emitters:
  - random
  - genetic
  - genetic
  - llm

initial_random_candidates: 20

genetic:
  mutation_scale: 0.02

llm:
  enabled: true

surrogate:
  enabled: true
  model_type: lightgbm
  checkpoint: artifacts/surrogate/checkpoints/nightly.pkl
  buffer_path: artifacts/surrogate/buffer_github_llm.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
