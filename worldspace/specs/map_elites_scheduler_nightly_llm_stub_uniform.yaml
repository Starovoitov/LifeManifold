schema_version: "1.2"
# Stub-hints control with uniform_frontier (parity with hints/filter target selection).
# Surrogate off (fixed stub constants in prompt). Post-arXiv sensitivity arm only;
# do not replace map_elites_scheduler_nightly_llm_stub.yaml (v2/G1 historical runs).
iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
# Matches hints/filter: uniform frontier avoids all batch slots targeting the same weakest niche.
target_selection: uniform_frontier

batch_emitters:
  - random
  - random
