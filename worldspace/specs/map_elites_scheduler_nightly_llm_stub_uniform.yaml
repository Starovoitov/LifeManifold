initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: true

surrogate:
  enabled: false
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v3_mc_d005.pkl
  buffer_path: artifacts/surrogate/buffer_experiment_stub_uniform.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0

performance:
  parallel_eval: true
  parallel_workers: 0
  llm_parallel_emit: true
  llm_parallel_workers: 4
  log_iteration_timing: true
