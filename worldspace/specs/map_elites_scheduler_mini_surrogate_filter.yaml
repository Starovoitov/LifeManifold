schema_version: "1.2"
# Fast CI run with acquisition.mode filter (skip when policy allows).
iterations: 2
batch_size: 4
grid_resolution: 10
early_extinction_step: 200
min_steps: 200

batch_emitters:
  - random
  - genetic
  - genetic
  - llm

initial_random_candidates: 0

genetic:
  mutation_scale: 0.02

llm:
  enabled: false

surrogate:
  enabled: true
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v3_mc_d005.pkl
  buffer_path: artifacts/surrogate/buffer.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
  # Isotonic uncertainty map (fit with scripts/calibrate_surrogate_uncertainty.py).
  # Disable: omit this key, set to null, false, or "" — then raw ensemble spread is used.
  calibration: artifacts/surrogate/checkpoints/calibration_v3_mc_d005.pkl
  surrogate_archive_path: artifacts/surrogate/surrogate_archive.jsonl
  acquisition:
    mode: filter
    policy: threshold_gate
    min_predicted_fitness: 0.99
    max_uncertainty_to_skip: 0.40
    never_skip_empty_bin: true
  retrain:
    enabled: false
