schema_version: "1.2"
# H1 Path A: single-pass hints draft + child-level surrogate rewrite.
# Protocol: artifacts/Q1_H1_CHILD_REWRITE.md
# Matched to map_elites_scheduler_nightly_llm.yaml except llm.child_rewrite.
iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

batch_emitters:
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
