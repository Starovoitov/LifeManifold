schema_version: "1.2"
# H2 ranking-isolation control: rate-matched random skip on the genetic ME stack.
# Same 20R+30G / uniform_frontier / MLP predict path as genetic_me_filter; skip
# decisions are Bernoulli(random_skip_rate) with the same empty-bin force-eval.
# Protocol: artifacts/Q1_H2_RANKING_CONTROLS.md
iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

batch_emitters:
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
