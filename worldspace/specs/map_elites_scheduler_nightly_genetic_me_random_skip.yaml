  - genetic
  - genetic
  - genetic
  - genetic

initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: false

surrogate:
  enabled: true
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v3_mc_d005.pkl
  buffer_path: artifacts/surrogate/buffer_experiment_genetic_me_random_skip.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
  extinction_gate_threshold: 0.95
  calibration: artifacts/surrogate/checkpoints/calibration_v3_mc_d005.pkl
  surrogate_archive_path: artifacts/surrogate/surrogate_archive_experiment_genetic_me_random_skip.jsonl
  acquisition:
    mode: filter
    policy: random_skip
    # Matched to primary genetic_me_filter mean skip rate (33.5%).
    random_skip_rate: 0.335
    min_predicted_fitness: 0.45
    max_uncertainty_to_skip: 1.0
    never_skip_empty_bin: true
  retrain:
    enabled: false

performance:
  parallel_eval: true
  parallel_workers: 0
  llm_parallel_emit: false
  llm_parallel_workers: 0
  log_iteration_timing: true
