schema_version: "1.2"
# Shadow acquisition for Q1 filter calibration (EXPERIMENT_PROTOCOL_Q1.md §4).
# Same thresholds as map_elites_scheduler_nightly_llm_filter.yaml but mode=shadow:
# every candidate is evaluated; surrogate_archive records would_skip decisions.
iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

batch_emitters:
  - random
  - random
  - random
  - random
  - random
  - random
  - random
