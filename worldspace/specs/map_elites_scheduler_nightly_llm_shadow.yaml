  - llm
  - llm
  - llm
  - llm
  - llm
  - llm

initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: true

surrogate:
  enabled: true
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v2.pkl
  buffer_path: artifacts/surrogate/buffer_experiment_shadow.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
  calibration: artifacts/surrogate/checkpoints/calibration.pkl
  surrogate_archive_path: artifacts/surrogate/surrogate_archive_shadow.jsonl
  acquisition:
    mode: shadow
    policy: threshold_gate
    # Same thresholds as map_elites_scheduler_nightly_llm_filter.yaml (shadow calibration).
    min_predicted_fitness: 0.10
    max_uncertainty_to_skip: 0.022
    never_skip_empty_bin: true
  retrain:
    enabled: false

# Forkserver pool reused across iterations (numba_simulator must stay false).
performance:
  parallel_eval: true
  parallel_workers: 0
