schema_version: "1.2"
# Nightly baseline: 650 × 50 = 32_500 evals/phase (~3h full pipeline at ~140 ms/eval + train)
iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200

# Same slot mix as production (20 random + 20 genetic + 10 llm).
batch_emitters:
  - random
  - random
  - random
  - random
  - random
  - random
