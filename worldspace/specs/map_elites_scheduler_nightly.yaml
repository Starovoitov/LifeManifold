schema_version: "1.2"
# Full production budget: iterations: 10000  (10_000 × 50 = 500_000 evaluations)
iterations: 100
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200

# Same slot mix as production (20 random + 20 genetic + 10 llm).
