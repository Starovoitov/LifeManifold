schema_version: "1.2"
# Q1 v3 factorial cell (−LLM, +surrogate filter): genetic ME + threshold_gate acquisition.
# Same 20R+30G slot mix as genetic_me / B1b; no LLM; matched filter policy as q1-full filter arm.
# Protocol: artifacts/EXPERIMENT_PROTOCOL_Q1_v3.md §3.8
iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

