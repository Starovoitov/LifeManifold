schema_version: "1.2"
# PILOT SKETCH (NOT RUN) — acquisition filter + stub LLM hints.
#
# Goal: isolate "reject bad" vs "hint good" on the LLM stack at uniform_frontier.
# Frozen filter arm uses REAL hints in prompt + threshold_gate (~33% skip).
# This YAML documents the intended contrast vs:
#   - map_elites_scheduler_nightly_llm_filter.yaml (hints + filter) — q1-full
#   - map_elites_scheduler_nightly_llm_stub_uniform.yaml (stub, no filter)
#
# BLOCKER: with surrogate.enabled=true, resolve_surrogate_prediction() feeds real
# hints to the LLM. Acquisition filter requires surrogate.enabled=true.
# Implement one of:
#   - llm.stub_hints_only: true  (prompt stub; facade still predicts for gate)
#   - or separate resolve path in llm_emitter for filter_stub arms
#
# Until code lands, use genetic_me_filter for reject-without-LLM (protocol §3.8).
#
# Suggested arm label: filter_stub
# Suggested tier: q1-filter-stub-pilot (seed 0 only)
# Compare vs: stub_uniform, filter, hints on seed 0

iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

batch_emitters:
  - random
  - random
  - random
  - random
