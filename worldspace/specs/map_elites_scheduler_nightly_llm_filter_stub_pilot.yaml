initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: true
  # stub_hints_only: true   # NOT IN SCHEMA YET — add in scheduler + llm_emitter

surrogate:
  enabled: true
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v3_mc_d005.pkl
  buffer_path: artifacts/surrogate/buffer_experiment_filter_stub.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
  extinction_gate_threshold: 0.95
  calibration: artifacts/surrogate/checkpoints/calibration_v3_mc_d005.pkl
  acquisition:
    mode: filter
    policy: threshold_gate
    min_predicted_fitness: 0.45
    max_uncertainty_to_skip: 1.0
    never_skip_empty_bin: true
  retrain:
    enabled: false

performance:
  parallel_eval: true
  parallel_workers: 0
  llm_parallel_emit: true
  llm_parallel_workers: 4
  log_iteration_timing: true
