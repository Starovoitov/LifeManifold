schema_version: "1.2"
# H3 confirmatory arm (protocol amendment 2026-07-28): LLM hints + filter with
# force-eval on ambiguous extinction band p_ext in [0.5, 0.95).
# Contrast vs q1-full/hints at matched uniform_frontier; F-RQ3-gray family.
iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

batch_emitters:
  - random
  - random
  - random
  - random
  - random
  - random
