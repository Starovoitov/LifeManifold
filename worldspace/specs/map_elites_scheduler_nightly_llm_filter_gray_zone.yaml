  - llm
  - llm
  - llm

initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: true

surrogate:
  enabled: true
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v3_mc_d005.pkl
  buffer_path: artifacts/surrogate/buffer_experiment_filter_gray_zone.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
  extinction_gate_threshold: 0.95
  calibration: artifacts/surrogate/checkpoints/calibration_v3_mc_d005.pkl
  surrogate_archive_path: artifacts/surrogate/surrogate_archive_experiment_filter_gray_zone.jsonl
  acquisition:
    mode: filter
    policy: threshold_gate
    min_predicted_fitness: 0.45
    max_uncertainty_to_skip: 1.0
    never_skip_empty_bin: true
    force_eval_extinction_gray_zone: true
    extinction_gray_zone_lo: 0.5
    extinction_gray_zone_hi: 0.95
  retrain:
    enabled: false

performance:
  parallel_eval: true
  parallel_workers: 0
  llm_parallel_emit: true
  llm_parallel_workers: 4
  log_iteration_timing: true
