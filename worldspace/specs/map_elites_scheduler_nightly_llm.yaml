schema_version: "1.2"
# Full nightly budget with LLM emitter (650 × 10 LLM = 6_500 API calls per seed).
# Control arm for surrogate hints A/B: map_elites_scheduler_nightly_llm_stub.yaml
# Aligned with filter arm: uniform_frontier + extinction gate + calibration.
iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

batch_emitters:
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
