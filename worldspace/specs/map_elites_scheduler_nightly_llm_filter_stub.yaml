schema_version: "1.2"
# Mixed-stack 2×2 cell C: acquisition filter ON + stub prompt scalars.
# Protocol: artifacts/Q1_H1H2_MIXED_STACK_2X2.md
# Contrast vs:
#   - map_elites_scheduler_nightly_llm_stub_uniform.yaml (A: stub, no filter)
#   - map_elites_scheduler_nightly_llm.yaml (B: live hints, no filter)
#   - map_elites_scheduler_nightly_llm_filter.yaml (D: live hints + filter)
#
# llm.stub_hints_only keeps prompt at stub_mean/stub_uncertainty while
# surrogate.enabled=true loads the live facade for threshold_gate on children.

iterations: 650
batch_size: 50
grid_resolution: 50
early_extinction_step: 200
min_steps: 200
target_selection: uniform_frontier

batch_emitters:
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - random
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - genetic
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm
  - llm

initial_random_candidates: 100

genetic:
  mutation_scale: 0.02

llm:
  enabled: true
  stub_hints_only: true

surrogate:
  enabled: true
  model_type: mlp
  checkpoint: artifacts/surrogate/checkpoints/nightly_v3_mc_d005.pkl
  buffer_path: artifacts/surrogate/buffer_experiment_filter_stub.jsonl
  stub_mean: 0.5
  stub_uncertainty: 1.0
  extinction_gate_threshold: 0.95
  calibration: artifacts/surrogate/checkpoints/calibration_v3_mc_d005.pkl
  surrogate_archive_path: artifacts/surrogate/surrogate_archive_filter_stub.jsonl
  acquisition:
    mode: filter
    policy: threshold_gate
    min_predicted_fitness: 0.45
    max_uncertainty_to_skip: 1.0
    never_skip_empty_bin: true
  retrain:
    enabled: false

performance:
  parallel_eval: true
  parallel_workers: 0
  llm_parallel_emit: true
  llm_parallel_workers: 4
  log_iteration_timing: true
