schema_version: "1.3"
# GitHub LLM special (CVT): nightly batch shape, 20 LLM slots, 2500 Voronoi niches.
iterations: 120
batch_size: 50
early_extinction_step: 200
min_steps: 200

archive:
  type: cvt
  n_centroids: 2500
  cvt_seed: 0
  lloyd_iterations: 50

