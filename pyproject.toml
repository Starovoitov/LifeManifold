[project]
name = "lifemanifold"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy",
    "pydantic>=2.7",
    "pandas>=2.0",
    "pygad",
    "pyyaml>=6",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "torch>=2.2",
    "umap-learn>=0.5.6",
]

[dependency-groups]
dev = [
    "black",
    "pyright",
    "ruff",
    "types-PyYAML",
]
dashboard = [
    "streamlit>=1.42",
    "polars",
    "plotly",
]

[tool.ruff.lint.per-file-ignores]
"dashboard/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportPrivateImportUsage = "none"

[tool.uv]
package = false

# CUDA wheels for MLP surrogate training (--device auto falls back to CPU when unavailable).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
