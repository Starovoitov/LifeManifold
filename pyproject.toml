[project]
name = "godmode-project"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy",
    "pydantic>=2.7",
    "pandas>=2.0",
    "pygad",
    "pyyaml>=6",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "umap-learn>=0.5.6",
]

[dependency-groups]
dev = [
    "black",
    "pyright",
    "ruff",
    "types-PyYAML",
]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportPrivateImportUsage = "none"

[tool.uv]
package = false

# CPU-only wheels (avoid multi‑GB CUDA stacks for the small MLP generator).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
